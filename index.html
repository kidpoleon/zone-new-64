<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zone-new-64</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://raw.githubusercontent.com/nickdesaulniers/javascript-playlist-parser/master/lib/parser.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000828;
      --bg-2: #001840;
      --panel: rgba(0, 24, 64, 0.72);
      --panel-strong: rgba(0, 24, 64, 0.92);
      --border: rgba(219, 247, 249, 0.12);
      --text: #b8d4d6;
      --muted: rgba(184, 212, 214, 0.58);
      --accent: #1688b8;
      --accent-strong: #044a90;
      --radius: 20px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.44);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-family: "Inter", Inter, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(22, 136, 184, 0.15), transparent 24%),
        radial-gradient(circle at 82% 10%, rgba(4, 74, 144, 0.15), transparent 22%),
        linear-gradient(180deg, #000828 0%, #001840 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: 0.34;
      background:
        repeating-radial-gradient(circle at 18% 14%, rgba(219, 247, 249, 0.05) 0 1px, transparent 1px 18px),
        repeating-radial-gradient(circle at 78% 70%, rgba(31, 165, 223, 0.05) 0 1px, transparent 1px 22px);
    }

    body::after {
      opacity: 0.22;
      background:
        linear-gradient(rgba(219, 247, 249, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(219, 247, 249, 0.02) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.92) 18%, rgba(0, 0, 0, 0.92) 82%, transparent);
    }

    .shell {
      width: min(1160px, calc(100% - 20px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .frame {
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(0, 13, 62, 0.88), rgba(0, 40, 94, 0.74));
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(219, 247, 249, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.7rem);
      letter-spacing: -0.05em;
      line-height: 1;
      font-weight: 650;
    }

    .mode-bar {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(219, 247, 249, 0.04);
      border: 1px solid rgba(219, 247, 249, 0.1);
    }

    .hamburger-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 999px;
      transition: background 140ms ease, color 140ms ease;
    }

    .hamburger-btn:hover {
      background: rgba(219, 247, 249, 0.08);
      color: var(--text);
    }

    .hamburger-btn svg {
      width: 20px;
      height: 20px;
    }

    .controls-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 200px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--panel-strong);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 140ms ease, visibility 140ms ease, transform 140ms ease;
    }

    .controls-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .controls-menu h3 {
      margin: 0 0 12px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mode-chip {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
    }

    .mode-chip.active {
      background: var(--accent);
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
    }

    .column {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .column-middle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 18px 10px;
    }

    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    textarea,
    pre,
    .stack,
    .status {
      width: 100%;
      border: 1px solid rgba(219, 247, 249, 0.1);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
    }

    textarea,
    pre {
      min-height: 300px;
      padding: 18px;
      resize: vertical;
      outline: none;
      font: 500 14px/1.65 var(--mono);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    textarea {
      background: rgba(0, 13, 62, 0.72);
    }

    textarea:focus {
      border-color: rgba(31, 165, 223, 0.4);
      box-shadow: 0 0 0 4px rgba(31, 165, 223, 0.08);
    }

    .toolbar,
    .tool-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar {
      margin-top: 14px;
    }

    button {
      border: 1px solid rgba(219, 247, 249, 0.1);
      border-radius: 14px;
      padding: 11px 14px;
      background: rgba(219, 247, 249, 0.06);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, opacity 140ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button#clearBtn:hover {
      background: rgba(219, 60, 60, 0.15);
      border-color: rgba(219, 60, 60, 0.3);
      color: #ff6b6b;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .primary {
      background: var(--accent);
      border-color: rgba(31, 165, 223, 0.45);
    }

    .stack {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .toggle {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .toggle input {
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .toggle span {
      color: var(--text);
    }

    .status {
      min-height: 48px;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      line-height: 1.4;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(31, 165, 223, 0.08);
      flex: 0 0 auto;
    }

    .pulse.good {
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(31, 165, 223, 0.08);
    }

    .pulse.bad {
      background: #dbf7f9;
      box-shadow: 0 0 0 6px rgba(219, 247, 249, 0.08);
    }

    .url-display {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .url-display span {
      padding: 12px 14px;
      border: 1px solid rgba(219, 247, 249, 0.1);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      font: 500 14px/1.65 var(--mono);
      word-break: break-all;
    }

    .url-actions {
      display: flex;
      gap: 10px;
    }

    .url-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .url-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(219, 247, 249, 0.04);
      border: 1px solid rgba(219, 247, 249, 0.08);
      border-radius: 8px;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .url-item:hover {
      background: rgba(219, 247, 249, 0.08);
      border-color: rgba(219, 247, 249, 0.12);
    }

    .url-text {
      flex: 1;
      color: var(--text);
      font: 500 13px/1.65 var(--mono);
      word-break: break-all;
      min-width: 0;
    }

    .url-item-actions {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 140ms ease;
    }

    .url-item:hover .url-item-actions {
      opacity: 1;
    }

    .url-item-actions button {
      padding: 6px 10px;
      font-size: 13px;
      min-width: auto;
    }

    .url-item-actions button i {
      margin-right: 4px;
    }

    @media (hover: none) {
      .url-item-actions {
        opacity: 1;
      }
    }

    .mode-tabs {
      display: flex;
      gap: 4px;
      background: rgba(219, 247, 249, 0.04);
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .mode-tab {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 140ms ease;
    }

    .mode-tab:hover {
      color: var(--text);
      background: rgba(219, 247, 249, 0.06);
    }

    .mode-tab.active {
      color: var(--text);
      background: var(--accent);
      border-color: rgba(31, 165, 223, 0.45);
    }

    .xtream-login {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: rgba(219, 247, 249, 0.04);
      border: 1px solid rgba(219, 247, 249, 0.08);
      border-radius: 8px;
    }

    .xtream-login input {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: rgba(219, 247, 249, 0.06);
      border: 1px solid rgba(219, 247, 249, 0.12);
      border-radius: 6px;
      outline: none;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .xtream-login input:focus {
      border-color: var(--accent);
      background: rgba(219, 247, 249, 0.08);
    }

    .xtream-login input::placeholder {
      color: var(--muted);
    }

    .video-player {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-player video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 400px;
      overflow-y: auto;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(219, 247, 249, 0.04);
      border: 1px solid rgba(219, 247, 249, 0.08);
      border-radius: 6px;
      cursor: pointer;
      transition: all 140ms ease;
    }

    .channel-item:hover {
      background: rgba(219, 247, 249, 0.08);
      border-color: rgba(219, 247, 249, 0.12);
    }

    .channel-item.active {
      background: rgba(31, 165, 223, 0.15);
      border-color: rgba(31, 165, 223, 0.3);
    }

    .channel-logo {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: contain;
      background: rgba(219, 247, 249, 0.06);
    }

    .channel-info {
      flex: 1;
      min-width: 0;
    }

    .channel-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-group {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .channel-search {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: rgba(219, 247, 249, 0.06);
      border: 1px solid rgba(219, 247, 249, 0.12);
      border-radius: 6px;
      outline: none;
      margin-bottom: 12px;
      width: 100%;
    }

    .channel-search:focus {
      border-color: var(--accent);
      background: rgba(219, 247, 249, 0.08);
    }

    .channel-search::placeholder {
      color: var(--muted);
    }

    .m3u-upload {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: rgba(219, 247, 249, 0.04);
      border: 1px solid rgba(219, 247, 249, 0.08);
      border-radius: 8px;
    }

    .m3u-upload input[type="file"] {
      display: none;
    }

    .m3u-upload label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      background: rgba(219, 247, 249, 0.06);
      border: 1px dashed rgba(219, 247, 249, 0.3);
      border-radius: 6px;
      cursor: pointer;
      transition: all 140ms ease;
    }

    .m3u-upload label:hover {
      background: rgba(219, 247, 249, 0.1);
      border-color: var(--accent);
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .success-flash {
      animation: flash 0.3s ease;
    }

    @keyframes flash {
      0%, 100% { background: var(--panel); }
      50% { background: rgba(22, 136, 184, 0.2); }
    }

    .footer {
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      border-top: 1px solid rgba(219, 247, 249, 0.08);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 140ms ease;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .column + .column {
        border-left: 0;
        border-top: 1px solid rgba(219, 247, 249, 0.08);
      }

      .column-middle {
        flex-direction: row;
        justify-content: flex-start;
        padding: 12px 20px;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 12px, 1160px);
        padding-top: 8px;
      }

      .frame {
        border-radius: 22px;
      }

      .topbar,
      .column {
        padding-left: 14px;
        padding-right: 14px;
      }

      .mode-bar {
        width: 100%;
        grid-template-columns: 1fr 1fr;
      }

      textarea,
      pre {
        min-height: 220px;
      }

      .column-middle {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .column-middle button {
        flex: 1;
        min-width: 80px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="frame">
      <header class="topbar">
        <h1>zone-new-64</h1>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="mode-bar" aria-label="Mode selector">
            <button id="modeEncode" class="mode-chip" type="button">Encode</button>
            <button id="modeDecode" class="mode-chip active" type="button">Decode</button>
          </div>
          <div style="position: relative;">
            <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <div id="controlsMenu" class="controls-menu">
              <h3>Controls</h3>
              <div class="mode-tabs">
                <button class="mode-tab active" data-mode="base64">Base64</button>
                <button class="mode-tab" data-mode="m3u">M3U</button>
                <button class="mode-tab" data-mode="xtream">Xtream</button>
              </div>
              
              <div class="content-section active" id="base64Section">
                <div class="stack">
                  <label class="toggle"><input id="bulkMode" type="checkbox" checked /><span>Bulk</span></label>
                  <label class="toggle"><input id="dirtyScan" type="checkbox" checked /><span>Dirty scan</span></label>
                  <label class="toggle"><input id="urlSafe" type="checkbox" checked /><span>URL-safe</span></label>
                  <label class="toggle"><input id="stripWhitespace" type="checkbox" checked /><span>Strip whitespace</span></label>
                  <label class="toggle"><input id="repairPadding" type="checkbox" checked /><span>Repair padding</span></label>
                </div>
              </div>

              <div class="content-section" id="m3uSection">
                <div class="m3u-upload">
                  <input type="file" id="m3uFile" accept=".m3u,.m3u8">
                  <label for="m3uFile">
                    <i class="fas fa-upload"></i>
                    Upload M3U Playlist
                  </label>
                </div>
              </div>

              <div class="content-section" id="xtreamSection">
                <div class="xtream-login">
                  <input type="text" id="xtreamUrl" placeholder="Server URL (e.g., http://example.com:8080)">
                  <input type="text" id="xtreamUsername" placeholder="Username">
                  <input type="password" id="xtreamPassword" placeholder="Password">
                  <button id="xtreamConnect" class="primary" type="button">Connect</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="grid">
        <section class="column">
          <div class="section" id="inputSection">
            <div class="section-title">
              <h2>Input</h2>
            </div>
            <textarea id="input" spellcheck="false" placeholder="Type or paste here" aria-label="Input text area"></textarea>
          </div>

          <div class="section" id="playerSection" style="display: none;">
            <div class="section-title">
              <h2>Player</h2>
            </div>
            <div class="video-player">
              <video id="videoPlayer" controls></video>
            </div>
          </div>
        </section>

        <aside class="column column-middle">
          <button id="runBtn" class="primary" type="button" aria-label="Process input">Process</button>
          <button id="pasteBtn" type="button" title="Paste from clipboard">Paste</button>
          <button id="clearBtn" type="button" aria-label="Clear input and output">Clear</button>
        </aside>

        <aside class="column">
          <div class="section" id="outputSection">
            <div class="section-title">
              <h2>Output</h2>
            </div>
            <pre id="output" aria-label="Output text area">Ready.</pre>
          </div>

          <div class="section" id="channelSection" style="display: none;">
            <div class="section-title">
              <h2>Channels</h2>
            </div>
            <input type="text" id="channelSearch" class="channel-search" placeholder="Search channels...">
            <div id="channelList" class="channel-list"></div>
          </div>

          <div class="section" id="urlSection" style="display: none;">
            <div class="section-title">
              <h2>Detected URLs</h2>
            </div>
            <div id="urlList" class="url-list"></div>
          </div>
        </aside>
      </div>
    </section>
    <footer class="footer">
      <div class="footer-links">
        <a href="https://github.com/kidpoleon/zone-new-64" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
        <a href="https://www.reddit.com/r/IPTV_ZONENEW/" target="_blank" rel="noopener noreferrer">r/IPTV_ZONENEW</a>
      </div>
    </footer>
  </main>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const pasteBtn = document.getElementById("pasteBtn");
    const modeEncode = document.getElementById("modeEncode");
    const modeDecode = document.getElementById("modeDecode");
    const hamburgerBtn = document.getElementById("hamburgerBtn");
    const controlsMenu = document.getElementById("controlsMenu");
    const bulkMode = document.getElementById("bulkMode");
    const dirtyScan = document.getElementById("dirtyScan");
    const urlSafe = document.getElementById("urlSafe");
    const stripWhitespace = document.getElementById("stripWhitespace");
    const repairPadding = document.getElementById("repairPadding");
    const urlSection = document.getElementById("urlSection");
    const urlList = document.getElementById("urlList");
    
    // IPTV mode elements
    const modeTabs = document.querySelectorAll('.mode-tab');
    const base64Section = document.getElementById('base64Section');
    const m3uSection = document.getElementById('m3uSection');
    const xtreamSection = document.getElementById('xtreamSection');
    const inputSection = document.getElementById('inputSection');
    const outputSection = document.getElementById('outputSection');
    const playerSection = document.getElementById('playerSection');
    const channelSection = document.getElementById('channelSection');
    const m3uFile = document.getElementById('m3uFile');
    const xtreamUrl = document.getElementById('xtreamUrl');
    const xtreamUsername = document.getElementById('xtreamUsername');
    const xtreamPassword = document.getElementById('xtreamPassword');
    const xtreamConnect = document.getElementById('xtreamConnect');
    const videoPlayer = document.getElementById('videoPlayer');
    const channelList = document.getElementById('channelList');
    const channelSearch = document.getElementById('channelSearch');

    let currentMode = "encode";
    let lastOutputText = "";
    let lastDecodedTexts = [];
    let lastUrlList = [];
    
    // IPTV state
    let appMode = "base64"; // base64, m3u, xtream
    let channels = [];
    let currentChannel = null;
    let hls = null;

    function switchAppMode(mode) {
      appMode = mode;
      
      // Update tab styles
      modeTabs.forEach(tab => {
        tab.classList.toggle('active', tab.dataset.mode === mode);
      });
      
      // Update content sections
      base64Section.classList.toggle('active', mode === 'base64');
      m3uSection.classList.toggle('active', mode === 'm3u');
      xtreamSection.classList.toggle('active', mode === 'xtream');
      
      // Update main sections
      if (mode === 'base64') {
        inputSection.style.display = 'flex';
        outputSection.style.display = 'flex';
        playerSection.style.display = 'none';
        channelSection.style.display = 'none';
        urlSection.style.display = 'none';
      } else {
        inputSection.style.display = 'none';
        outputSection.style.display = 'none';
        playerSection.style.display = 'flex';
        channelSection.style.display = 'flex';
        urlSection.style.display = 'none';
      }
    }

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        switchAppMode(tab.dataset.mode);
      });
    });

    // M3U file upload handler
    m3uFile.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        parseM3U(content);
      };
      reader.readAsText(file);
    });

    function parseM3U(content) {
      try {
        const playlist = M3U.parse(content);
        channels = playlist.map((item, index) => ({
          id: index,
          name: item.title || `Channel ${index + 1}`,
          url: item.file,
          logo: item.logo || null,
          group: item.group || 'Uncategorized'
        }));
        
        displayChannels(channels);
        switchAppMode('m3u');
      } catch (error) {
        console.error('Error parsing M3U:', error);
      }
    }

    function displayChannels(channelData) {
      channelList.innerHTML = '';
      
      channelData.forEach(channel => {
        const channelItem = document.createElement('div');
        channelItem.className = 'channel-item';
        channelItem.dataset.id = channel.id;
        
        const logo = document.createElement('img');
        logo.className = 'channel-logo';
        logo.src = channel.logo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect fill="%23219,247,249,0.06" width="40" height="40"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23b8d4d6" font-size="12">TV</text></svg>';
        logo.alt = channel.name;
        
        const info = document.createElement('div');
        info.className = 'channel-info';
        
        const name = document.createElement('div');
        name.className = 'channel-name';
        name.textContent = channel.name;
        
        const group = document.createElement('div');
        group.className = 'channel-group';
        group.textContent = channel.group;
        
        info.appendChild(name);
        info.appendChild(group);
        
        channelItem.appendChild(logo);
        channelItem.appendChild(info);
        
        channelItem.addEventListener('click', () => {
          playChannel(channel);
        });
        
        channelList.appendChild(channelItem);
      });
    }

    function playChannel(channel) {
      currentChannel = channel;
      
      // Update active state
      document.querySelectorAll('.channel-item').forEach(item => {
        item.classList.toggle('active', parseInt(item.dataset.id) === channel.id);
      });
      
      // Play stream
      if (Hls.isSupported() && channel.url.includes('.m3u8')) {
        if (hls) {
          hls.destroy();
        }
        hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(videoPlayer);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          videoPlayer.play();
        });
      } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
        videoPlayer.src = channel.url;
        videoPlayer.play();
      } else {
        videoPlayer.src = channel.url;
        videoPlayer.play();
      }
    }

    // Channel search
    channelSearch.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = channels.filter(channel => 
        channel.name.toLowerCase().includes(searchTerm) ||
        channel.group.toLowerCase().includes(searchTerm)
      );
      displayChannels(filtered);
    });

    // Xtream API integration
    xtreamConnect.addEventListener('click', async () => {
      const url = xtreamUrl.value.trim();
      const username = xtreamUsername.value.trim();
      const password = xtreamPassword.value.trim();
      
      if (!url || !username || !password) {
        alert('Please fill in all fields');
        return;
      }
      
      try {
        const apiUrl = `${url}/player_api.php?username=${username}&password=${password}`;
        const response = await fetch(apiUrl);
        const data = await response.json();
        
        if (data.user_info && data.user_info.status === 'Active') {
          // Fetch live channels
          await fetchXtreamLiveChannels(url, username, password);
          switchAppMode('xtream');
        } else {
          alert('Authentication failed. Please check your credentials.');
        }
      } catch (error) {
        console.error('Xtream API error:', error);
        alert('Failed to connect to Xtream server. Please check your URL and try again.');
      }
    });

    async function fetchXtreamLiveChannels(url, username, password) {
      try {
        const response = await fetch(`${url}/player_api.php?username=${username}&password=${password}&action=get_live_categories`);
        const categories = await response.json();
        
        const channelsData = [];
        
        for (const category of categories) {
          const categoryResponse = await fetch(`${url}/player_api.php?username=${username}&password=${password}&action=get_live_streams&category_id=${category.category_id}`);
          const categoryChannels = await categoryResponse.json();
          
          categoryChannels.forEach((channel, index) => {
            channelsData.push({
              id: channel.stream_id,
              name: channel.name,
              url: `${url}/live/${username}/${password}/${channel.stream_id}.m3u8`,
              logo: channel.stream_icon || null,
              group: category.category_name
            });
          });
        }
        
        channels = channelsData;
        displayChannels(channels);
      } catch (error) {
        console.error('Error fetching Xtream channels:', error);
      }
    }

    function checkForUrls(text) {
      const urlRegex = /https?:\/\/[^\s<>"'`]+/gi;
      const matches = text.match(urlRegex);
      
      if (matches && matches.length > 0) {
        // Remove duplicates and clean URLs
        const uniqueUrls = [...new Set(matches)].map(url => url.replace(/[),.;!?]+$/g, ""));
        lastUrlList = uniqueUrls;
        
        // Clear existing URL list
        urlList.innerHTML = '';
        
        // Create URL items with inline buttons
        uniqueUrls.forEach(url => {
          const urlItem = document.createElement('div');
          urlItem.className = 'url-item';
          
          const urlText = document.createElement('span');
          urlText.className = 'url-text';
          urlText.textContent = url;
          
          const urlActions = document.createElement('div');
          urlActions.className = 'url-item-actions';
          
          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(url).then(() => {
              // Successfully copied
            }).catch(() => {
              // Copy failed silently
            });
          };
          
          const openBtn = document.createElement('button');
          openBtn.type = 'button';
          openBtn.innerHTML = '<i class="fas fa-external-link-alt"></i> Open';
          openBtn.onclick = () => {
            try {
              window.open(url, '_blank', 'noopener,noreferrer');
            } catch (error) {
              // Failed to open URL silently
            }
          };
          
          urlActions.appendChild(copyBtn);
          urlActions.appendChild(openBtn);
          
          urlItem.appendChild(urlText);
          urlItem.appendChild(urlActions);
          
          urlList.appendChild(urlItem);
        });
        
        urlSection.style.display = 'block';
      } else {
        urlList.innerHTML = '';
        urlSection.style.display = 'none';
      }
    }


    function setMode(mode) {
      currentMode = mode;
      modeEncode.classList.toggle("active", mode === "encode");
      modeDecode.classList.toggle("active", mode === "decode");
      if (mode !== "decode") {
        lastDecodedTexts = [];
        lastUrlList = [];
      }
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    function normalizeBase64(raw) {
      let value = raw.trim();
      if (!value) return null;

      if (stripWhitespace.checked) {
        value = value.replace(/\s+/g, "");
      }

      if (urlSafe.checked) {
        value = value.replace(/-/g, "+").replace(/_/g, "/");
      }

      if (!/^[A-Za-z0-9+/=]+$/.test(value)) return null;
      if (/=.+[^=]/.test(value)) return null;

      if (repairPadding.checked) {
        const remainder = value.length % 4;
        if (remainder === 1) return null;
        if (remainder > 0) value += "=".repeat(4 - remainder);
      } else if (value.length % 4 !== 0) {
        return null;
      }

      const padCount = (value.match(/=/g) || []).length;
      if (padCount > 2) return null;

      return value;
    }

    function tryDecodeString(raw, options = {}) {
      const { minLength = 4 } = options;
      const normalized = normalizeBase64(raw);
      if (!normalized) {
        return { ok: false, reason: "Invalid Base64 structure." };
      }

      if (normalized.length < minLength) {
        return { ok: false, reason: "Too short to trust safely." };
      }

      try {
        const bytes = base64ToBytes(normalized);
        let text;
        try {
          text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        } catch {
          text = Array.from(bytes, (byte) => String.fromCharCode(byte)).join("");
        }

        return { ok: true, text, bytes, normalized, raw };
      } catch {
        return { ok: false, reason: "Decode failed." };
      }
    }

    function encodeString(raw) {
      const bytes = new TextEncoder().encode(raw);
      let encoded = bytesToBase64(bytes);
      if (urlSafe.checked) {
        encoded = encoded.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }
      return { encoded, bytes };
    }

    function extractUrls(text) {
      const matches = text.match(/https?:\/\/[^\s<>"'`]+/gi) || [];
      return matches.map((url) => url.replace(/[),.;!?]+$/g, ""));
    }

    function updateDerivedUrls() {
      const urls = [];
      const seen = new Set();
      for (const text of lastDecodedTexts) {
        for (const url of extractUrls(text)) {
          if (seen.has(url)) continue;
          seen.add(url);
          urls.push(url);
        }
      }
      lastUrlList = urls;
    }

    function collectCandidates(text) {
      const found = [];
      const seen = new Set();
      const regexes = [
        /(?<![A-Za-z0-9+/_-])[A-Za-z0-9+/_-]{6,}={0,2}(?![A-Za-z0-9+/_-])/g,
        /(?<![A-Za-z0-9+/_-])[A-Za-z0-9+/_-][A-Za-z0-9+/_=\-\s]{14,}[A-Za-z0-9=/_-](?![A-Za-z0-9+/_-])/g
      ];

      for (const regex of regexes) {
        regex.lastIndex = 0;
        let match;
        while ((match = regex.exec(text)) !== null) {
          const raw = match[0].trim();
          if (/^[a-z-]+$/i.test(raw) && !/[0-9_+/=]/.test(raw)) continue;
          const key = `${match.index}:${raw}`;
          if (seen.has(key)) continue;
          seen.add(key);

          const decoded = tryDecodeString(raw, { minLength: 8 });
          if (decoded.ok) {
            found.push(decoded.text);
          }
        }
      }

      return [...new Set(found)];
    }

    function resetDerived() {
      lastDecodedTexts = [];
      lastUrlList = [];
    }

    function processEncode() {
      const value = input.value;
      if (!value.trim()) {
        output.textContent = "Nothing to encode.";
        lastOutputText = "";
        resetDerived();
        input.focus();
        return;
      }

      try {
        const lines = bulkMode.checked
          ? value.split(/\r?\n/).filter((line) => line.trim() !== "")
          : [value];

        const encodedLines = lines.map((line) => encodeString(line).encoded);
        lastOutputText = encodedLines.join("\n");
        output.textContent = lastOutputText;
        resetDerived();
        checkForUrls(lastOutputText);
        output.classList.add("success-flash");
        setTimeout(() => output.classList.remove("success-flash"), 300);
      } catch (error) {
        output.textContent = "Encoding error: " + error.message;
        lastOutputText = "";
        resetDerived();
      }
    }

    function processDecode() {
      const value = input.value;
      if (!value.trim()) {
        output.textContent = "Nothing to decode.";
        lastOutputText = "";
        resetDerived();
        input.focus();
        return;
      }

      try {
        if (dirtyScan.checked && !bulkMode.checked) {
          const decodedTexts = collectCandidates(value);
          lastDecodedTexts = decodedTexts;
          updateDerivedUrls();
          lastOutputText = decodedTexts.join("\n\n");
          output.textContent = lastOutputText || "No valid Base64 found.";
          checkForUrls(lastOutputText);
          if (decodedTexts.length > 0) {
            output.classList.add("success-flash");
            setTimeout(() => output.classList.remove("success-flash"), 300);
          }
          return;
        }

        const lines = bulkMode.checked
          ? value.split(/\r?\n/).filter((line) => line.trim() !== "")
          : [value];

        const outputLines = [];
        const decodedTexts = [];

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i];
          const result = tryDecodeString(line, { minLength: bulkMode.checked ? 8 : 4 });
          if (result.ok) {
            outputLines.push(result.text);
            decodedTexts.push(result.text);
          } else {
            outputLines.push(`[line ${i + 1}] ${result.reason}`);
          }
        }

        lastDecodedTexts = decodedTexts;
        updateDerivedUrls();
        lastOutputText = outputLines.join("\n");
        output.textContent = lastOutputText;
        checkForUrls(lastOutputText);
        if (decodedTexts.length > 0) {
          output.classList.add("success-flash");
          setTimeout(() => output.classList.remove("success-flash"), 300);
        }
      } catch (error) {
        output.textContent = "Decoding error: " + error.message;
        lastOutputText = "";
        resetDerived();
      }
    }

    function run() {
      if (currentMode === "encode") {
        processEncode();
      } else {
        processDecode();
      }
    }

    modeEncode.addEventListener("click", () => setMode("encode"));
    modeDecode.addEventListener("click", () => setMode("decode"));
    runBtn.addEventListener("click", run);

    hamburgerBtn.addEventListener("click", () => {
      controlsMenu.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!hamburgerBtn.contains(e.target) && !controlsMenu.contains(e.target)) {
        controlsMenu.classList.remove("open");
      }
    });


    clearBtn.addEventListener("click", () => {
      input.value = "";
      output.textContent = "Ready.";
      lastOutputText = "";
      resetDerived();
      urlSection.style.display = "none";
      input.focus();
    });

    pasteBtn.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        input.value = text;
        input.focus();
      } catch (error) {
        // Silently fail on clipboard error
      }
    });


    input.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        run();
      }
    });

    // Add keyboard shortcut for clear (Ctrl+L or Cmd+L)
    input.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "l") {
        event.preventDefault();
        clearBtn.click();
      }
    });

    setMode("decode");
  </script>
</body>
</html>
