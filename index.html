<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zone-new-64</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000828;
      --bg-2: #001840;
      --panel: rgba(0, 24, 64, 0.72);
      --panel-strong: rgba(0, 24, 64, 0.92);
      --border: rgba(219, 247, 249, 0.12);
      --text: #b8d4d6;
      --muted: rgba(184, 212, 214, 0.58);
      --accent: #1688b8;
      --accent-strong: #044a90;
      --radius: 20px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.44);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-family: "Inter", Inter, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(22, 136, 184, 0.15), transparent 24%),
        radial-gradient(circle at 82% 10%, rgba(4, 74, 144, 0.15), transparent 22%),
        linear-gradient(180deg, #000828 0%, #001840 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: 0.34;
      background:
        repeating-radial-gradient(circle at 18% 14%, rgba(219, 247, 249, 0.05) 0 1px, transparent 1px 18px),
        repeating-radial-gradient(circle at 78% 70%, rgba(31, 165, 223, 0.05) 0 1px, transparent 1px 22px);
    }

    body::after {
      opacity: 0.22;
      background:
        linear-gradient(rgba(219, 247, 249, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(219, 247, 249, 0.02) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.92) 18%, rgba(0, 0, 0, 0.92) 82%, transparent);
    }

    .shell {
      width: min(1160px, calc(100% - 20px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .frame {
      border: 1px solid var(--border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(0, 13, 62, 0.88), rgba(0, 40, 94, 0.74));
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(219, 247, 249, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.7rem);
      letter-spacing: -0.05em;
      line-height: 1;
      font-weight: 650;
    }

    .mode-bar {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(219, 247, 249, 0.04);
      border: 1px solid rgba(219, 247, 249, 0.1);
    }

    .hamburger-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 999px;
      transition: background 140ms ease, color 140ms ease;
    }

    .hamburger-btn:hover {
      background: rgba(219, 247, 249, 0.08);
      color: var(--text);
    }

    .hamburger-btn svg {
      width: 20px;
      height: 20px;
    }

    .controls-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 200px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--panel-strong);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 140ms ease, visibility 140ms ease, transform 140ms ease;
    }

    .controls-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .controls-menu h3 {
      margin: 0 0 12px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mode-chip {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
    }

    .mode-chip.active {
      background: var(--accent);
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .column {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    textarea,
    pre,
    .stack,
    .status {
      width: 100%;
      border: 1px solid rgba(219, 247, 249, 0.1);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
    }

    textarea,
    pre {
      min-height: 300px;
      padding: 18px;
      resize: vertical;
      outline: none;
      font: 500 14px/1.65 var(--mono);
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    textarea {
      background: rgba(0, 13, 62, 0.72);
    }

    textarea:focus {
      border-color: rgba(31, 165, 223, 0.4);
      box-shadow: 0 0 0 4px rgba(31, 165, 223, 0.08);
    }

    .toolbar,
    .tool-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar {
      margin-top: 14px;
    }

    button {
      border: 1px solid rgba(219, 247, 249, 0.1);
      border-radius: 14px;
      padding: 11px 14px;
      background: rgba(219, 247, 249, 0.06);
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, opacity 140ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .primary {
      background: var(--accent);
      border-color: rgba(31, 165, 223, 0.45);
    }

    .stack {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .toggle {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .toggle input {
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .toggle span {
      color: var(--text);
    }

    .status {
      min-height: 48px;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      line-height: 1.4;
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(31, 165, 223, 0.08);
      flex: 0 0 auto;
    }

    .pulse.good {
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(31, 165, 223, 0.08);
    }

    .pulse.bad {
      background: #dbf7f9;
      box-shadow: 0 0 0 6px rgba(219, 247, 249, 0.08);
    }

    .url-display {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .url-display span {
      padding: 12px 14px;
      border: 1px solid rgba(219, 247, 249, 0.1);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      font: 500 14px/1.65 var(--mono);
      word-break: break-all;
    }

    .url-actions {
      display: flex;
      gap: 10px;
    }

    .footer {
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      border-top: 1px solid rgba(219, 247, 249, 0.08);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 140ms ease;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .column + .column {
        border-left: 0;
        border-top: 1px solid rgba(219, 247, 249, 0.08);
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 12px, 1160px);
        padding-top: 8px;
      }

      .frame {
        border-radius: 22px;
      }

      .topbar,
      .column {
        padding-left: 14px;
        padding-right: 14px;
      }

      .mode-bar {
        width: 100%;
        grid-template-columns: 1fr 1fr;
      }

      textarea,
      pre {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="frame">
      <header class="topbar">
        <h1>zone-new-64</h1>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="mode-bar" aria-label="Mode selector">
            <button id="modeEncode" class="mode-chip" type="button">Encode</button>
            <button id="modeDecode" class="mode-chip active" type="button">Decode</button>
          </div>
          <div style="position: relative;">
            <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <div id="controlsMenu" class="controls-menu">
              <h3>Controls</h3>
              <div class="stack">
                <label class="toggle"><input id="bulkMode" type="checkbox" checked /><span>Bulk</span></label>
                <label class="toggle"><input id="dirtyScan" type="checkbox" checked /><span>Dirty scan</span></label>
                <label class="toggle"><input id="urlSafe" type="checkbox" checked /><span>URL-safe</span></label>
                <label class="toggle"><input id="stripWhitespace" type="checkbox" checked /><span>Strip whitespace</span></label>
                <label class="toggle"><input id="repairPadding" type="checkbox" checked /><span>Repair padding</span></label>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="grid">
        <section class="column">
          <div class="section">
            <div class="section-title">
              <h2>Input</h2>
            </div>
            <textarea id="input" spellcheck="false" placeholder="Type or paste here"></textarea>
            <div class="toolbar">
              <button id="runBtn" class="primary" type="button">Process</button>
              <button id="clearBtn" type="button">Clear</button>
            </div>
          </div>
        </section>

        <aside class="column">

          <div class="section">
            <div class="section-title">
              <h2>Output</h2>
              <div class="tool-row">
                <button id="copyBtn" type="button">Copy</button>
              </div>
            </div>
            <pre id="output">Ready.</pre>
          </div>

          <div class="section" id="urlSection" style="display: none;">
            <div class="section-title">
              <h2>Detected URL</h2>
            </div>
            <div class="url-display">
              <span id="detectedUrl"></span>
              <div class="url-actions">
                <button id="copyUrlBtn" type="button">Copy</button>
                <button id="openUrlBtn" type="button">Open in New Tab</button>
              </div>
            </div>
          </div>

          <div class="section status">
            <span id="pulse" class="pulse"></span>
            <div id="statusText">Ready.</div>
          </div>
        </aside>
      </div>
    </section>
    <footer class="footer">
      <div class="footer-links">
        <a href="https://github.com/kidpoleon/zone-new-64" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
        <a href="https://www.reddit.com/r/IPTV_ZONENEW/" target="_blank" rel="noopener noreferrer">r/IPTV_ZONENEW</a>
      </div>
    </footer>
  </main>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const runBtn = document.getElementById("runBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const modeEncode = document.getElementById("modeEncode");
    const modeDecode = document.getElementById("modeDecode");
    const hamburgerBtn = document.getElementById("hamburgerBtn");
    const controlsMenu = document.getElementById("controlsMenu");
    const bulkMode = document.getElementById("bulkMode");
    const dirtyScan = document.getElementById("dirtyScan");
    const urlSafe = document.getElementById("urlSafe");
    const stripWhitespace = document.getElementById("stripWhitespace");
    const repairPadding = document.getElementById("repairPadding");
    const statusText = document.getElementById("statusText");
    const pulse = document.getElementById("pulse");
    const urlSection = document.getElementById("urlSection");
    const detectedUrl = document.getElementById("detectedUrl");
    const copyUrlBtn = document.getElementById("copyUrlBtn");
    const openUrlBtn = document.getElementById("openUrlBtn");

    let currentMode = "encode";
    let lastOutputText = "";
    let lastDecodedTexts = [];
    let lastUrlList = [];

    function setStatus(kind, text) {
      statusText.textContent = text;
      pulse.className = "pulse" + (kind ? " " + kind : "");
    }

    function checkForUrls(text) {
      const urlRegex = /https?:\/\/[^\s<>"'`]+/gi;
      const match = text.match(urlRegex);
      if (match && match.length > 0) {
        const url = match[0].replace(/[),.;!?]+$/g, "");
        detectedUrl.textContent = url;
        urlSection.style.display = "block";
      } else {
        urlSection.style.display = "none";
      }
    }


    function setMode(mode) {
      currentMode = mode;
      modeEncode.classList.toggle("active", mode === "encode");
      modeDecode.classList.toggle("active", mode === "decode");
      if (mode !== "decode") {
        lastDecodedTexts = [];
        lastUrlList = [];
      }
      setStatus("", "Ready.");
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      return Uint8Array.from(binary, (char) => char.charCodeAt(0));
    }

    function normalizeBase64(raw) {
      let value = raw.trim();
      if (!value) return null;

      if (stripWhitespace.checked) {
        value = value.replace(/\s+/g, "");
      }

      if (urlSafe.checked) {
        value = value.replace(/-/g, "+").replace(/_/g, "/");
      }

      if (!/^[A-Za-z0-9+/=]+$/.test(value)) return null;
      if (/=.+[^=]/.test(value)) return null;

      if (repairPadding.checked) {
        const remainder = value.length % 4;
        if (remainder === 1) return null;
        if (remainder > 0) value += "=".repeat(4 - remainder);
      } else if (value.length % 4 !== 0) {
        return null;
      }

      const padCount = (value.match(/=/g) || []).length;
      if (padCount > 2) return null;

      return value;
    }

    function tryDecodeString(raw, options = {}) {
      const { minLength = 4 } = options;
      const normalized = normalizeBase64(raw);
      if (!normalized) {
        return { ok: false, reason: "Invalid Base64 structure." };
      }

      if (normalized.length < minLength) {
        return { ok: false, reason: "Too short to trust safely." };
      }

      try {
        const bytes = base64ToBytes(normalized);
        let text;
        try {
          text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
        } catch {
          text = Array.from(bytes, (byte) => String.fromCharCode(byte)).join("");
        }

        return { ok: true, text, bytes, normalized, raw };
      } catch {
        return { ok: false, reason: "Decode failed." };
      }
    }

    function encodeString(raw) {
      const bytes = new TextEncoder().encode(raw);
      let encoded = bytesToBase64(bytes);
      if (urlSafe.checked) {
        encoded = encoded.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }
      return { encoded, bytes };
    }

    function extractUrls(text) {
      const matches = text.match(/https?:\/\/[^\s<>"'`]+/gi) || [];
      return matches.map((url) => url.replace(/[),.;!?]+$/g, ""));
    }

    function updateDerivedUrls() {
      const urls = [];
      const seen = new Set();
      for (const text of lastDecodedTexts) {
        for (const url of extractUrls(text)) {
          if (seen.has(url)) continue;
          seen.add(url);
          urls.push(url);
        }
      }
      lastUrlList = urls;
    }

    function collectCandidates(text) {
      const found = [];
      const seen = new Set();
      const regexes = [
        /(?<![A-Za-z0-9+/_-])[A-Za-z0-9+/_-]{6,}={0,2}(?![A-Za-z0-9+/_-])/g,
        /(?<![A-Za-z0-9+/_-])[A-Za-z0-9+/_-][A-Za-z0-9+/_=\-\s]{14,}[A-Za-z0-9=/_-](?![A-Za-z0-9+/_-])/g
      ];

      for (const regex of regexes) {
        regex.lastIndex = 0;
        let match;
        while ((match = regex.exec(text)) !== null) {
          const raw = match[0].trim();
          if (/^[a-z-]+$/i.test(raw) && !/[0-9_+/=]/.test(raw)) continue;
          const key = `${match.index}:${raw}`;
          if (seen.has(key)) continue;
          seen.add(key);

          const decoded = tryDecodeString(raw, { minLength: 8 });
          if (decoded.ok) {
            found.push(decoded.text);
          }
        }
      }

      return [...new Set(found)];
    }

    function resetDerived() {
      lastDecodedTexts = [];
      lastUrlList = [];
    }

    function processEncode() {
      const value = input.value;
      if (!value.trim()) {
        output.textContent = "Nothing to encode.";
        lastOutputText = "";
        resetDerived();
        setStatus("bad", "Input is empty.");
        return;
      }

      const lines = bulkMode.checked
        ? value.split(/\r?\n/).filter((line) => line.trim() !== "")
        : [value];

      const encodedLines = lines.map((line) => encodeString(line).encoded);
      lastOutputText = encodedLines.join("\n");
      output.textContent = lastOutputText;
      resetDerived();
      checkForUrls(lastOutputText);
      setStatus("good", `${encodedLines.length} item${encodedLines.length === 1 ? "" : "s"} encoded.`);
    }

    function processDecode() {
      const value = input.value;
      if (!value.trim()) {
        output.textContent = "Nothing to decode.";
        lastOutputText = "";
        resetDerived();
        setStatus("bad", "Input is empty.");
        return;
      }

      if (dirtyScan.checked && !bulkMode.checked) {
        const decodedTexts = collectCandidates(value);
        lastDecodedTexts = decodedTexts;
        updateDerivedUrls();
        lastOutputText = decodedTexts.join("\n\n");
        output.textContent = lastOutputText || "No valid Base64 found.";
        checkForUrls(lastOutputText);
        setStatus(decodedTexts.length ? "good" : "bad", decodedTexts.length ? `${decodedTexts.length} candidate${decodedTexts.length === 1 ? "" : "s"} decoded.` : "No valid Base64 found.");
        return;
      }

      const lines = bulkMode.checked
        ? value.split(/\r?\n/).filter((line) => line.trim() !== "")
        : [value];

      const outputLines = [];
      const decodedTexts = [];

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        const result = tryDecodeString(line, { minLength: bulkMode.checked ? 8 : 4 });
        if (result.ok) {
          outputLines.push(result.text);
          decodedTexts.push(result.text);
        } else {
          outputLines.push(`[line ${i + 1}] ${result.reason}`);
        }
      }

      lastDecodedTexts = decodedTexts;
      updateDerivedUrls();
      lastOutputText = outputLines.join("\n");
      output.textContent = lastOutputText;
      checkForUrls(lastOutputText);
      setStatus(decodedTexts.length ? "good" : "bad", `${decodedTexts.length} of ${lines.length} item${lines.length === 1 ? "" : "s"} decoded.`);
    }

    function run() {
      if (currentMode === "encode") {
        processEncode();
      } else {
        processDecode();
      }
    }

    modeEncode.addEventListener("click", () => setMode("encode"));
    modeDecode.addEventListener("click", () => setMode("decode"));
    runBtn.addEventListener("click", run);

    hamburgerBtn.addEventListener("click", () => {
      controlsMenu.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (!hamburgerBtn.contains(e.target) && !controlsMenu.contains(e.target)) {
        controlsMenu.classList.remove("open");
      }
    });


    clearBtn.addEventListener("click", () => {
      input.value = "";
      output.textContent = "Ready.";
      lastOutputText = "";
      resetDerived();
      urlSection.style.display = "none";
      setStatus("", "Ready.");
    });

    copyBtn.addEventListener("click", () => {
      const value = output.textContent === "Ready." ? lastOutputText : output.textContent;
      if (!value) {
        setStatus("bad", "Nothing to copy.");
        return;
      }

      navigator.clipboard.writeText(value).then(() => {
        setStatus("good", "Copied.");
      }).catch(() => {
        setStatus("bad", "Copy failed.");
      });
    });

    copyUrlBtn.addEventListener("click", () => {
      const url = detectedUrl.textContent;
      if (!url) {
        setStatus("bad", "No URL to copy.");
        return;
      }

      navigator.clipboard.writeText(url).then(() => {
        setStatus("good", "URL copied.");
      }).catch(() => {
        setStatus("bad", "Copy failed.");
      });
    });

    openUrlBtn.addEventListener("click", () => {
      const url = detectedUrl.textContent;
      if (!url) {
        setStatus("bad", "No URL to open.");
        return;
      }

      window.open(url, "_blank");
    });


    input.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        run();
      }
    });

    setMode("decode");
  </script>
</body>
</html>
